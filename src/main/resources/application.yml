spring:
  ai:
    openai:
      # read your API key from an environment variable — safer
      api-key: ${DEEPSEEK_API_KEY}
      # DeepSeek's OpenAI-compatible API base URL
      base-url: https://api.deepseek.com
      chat:
        options:
          # Model selection. deepseek-flash is good value; deepseek-v4-pro is more capable
          model: deepseek-flash
          # you can override this dynamically per call; this is just the default