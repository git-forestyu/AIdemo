spring:
  ai:
    openai:
      # 从环境变量读取你的 API Key，更安全
      api-key: ${DEEPSEEK_API_KEY}
      # DeepSeek 的 OpenAI 兼容接口地址
      base-url: https://api.deepseek.com
      chat:
        options:
          # 指定模型。deepseek-flash 性价比高，deepseek-v4-pro 能力更强
          model: deepseek-flash
          # 你可以在调用时动态覆盖，这里给个默认值